name: VehicleNBT
version: 1.0
main: com.example.vehiclenbt.VehicleNBTPlugin
api-version: 1.20
author: YourName
description: Plugin to export vehicle NBT data

commands:
  vehiclenbt:
    description: Export NBT data of nearest vehicle
    usage: /vehiclenbt
    permission: vehiclenbt.use
    permission-message: You don't have permission to use this command

permissions:
  vehiclenbt.use:
    description: Allows using /vehiclenbt command
    default: op
