
[display]
	#Range: 10 ~ 1000
	radarPingOverlaySize = 100
	#Allowed Values: ALL, PLAYERS, BOTS, VEHICLES, MOBS, OFF
	defaultRadarMode = "ALL"

[mouse-joystick-settings]
	#Only for vehicles in Mouse Mode. How far your mouse must move from rest to get a maximum angle.
	#Range: 0.0 ~ 10000.0
	mouseModeMaxRadius = 400.0
	#Speed the control stick vertically snaps back to rest when mouse isn't moving.
	#Range: 0.0 ~ 100.0
	stickPitchReturnRate = 0.0
	#Speed the control stick horizontally snaps back to rest when mouse isn't moving.
	#Range: 0.0 ~ 100.0
	stickRollReturnRate = 40.0
	#Range: 1 ~ 100
	stickPitchSteps = 5
	#Range: 1 ~ 100
	stickRollSteps = 5

[mouse-direct-settings]
	#Mouse Direct mode: how much mouse Y movement maps to pitch input per pixel. Higher = more sensitive. Default 0.015.
	#Range: 1.0E-4 ~ 1.0
	mouseDirectPitchSensitivity = 0.006
	#Mouse Direct mode: how much mouse X movement maps to roll input per pixel. Higher = more sensitive. Default 0.015.
	#Range: 1.0E-4 ~ 1.0
	mouseDirectRollSensitivity = 0.006
	#Mouse Direct mode: per-tick rate at which pitch/roll input decays to zero when mouse is not moving (0 = no decay, 1 = instant snap to zero). Default 0.02.
	#Range: 0.0 ~ 1.0
	mouseDirectReturnRate = 0.02
	#Mouse Direct mode return rate for helicopters. Lower = input holds longer after releasing mouse. Default 0.005.
	#Range: 0.0 ~ 1.0
	mouseDirectHeliReturnRate = 0.005

[control]
	#Invert vertical inputs.
	invertY = false
	#If enabled, turning your player head may feel more natural.
	cameraTurnRelativeToVehicle = true
	#If enabled, your sneak key binding doesn't dismount you from DSC vehicles. You will have to you the diamond star combat dismount keybinding instead (H by default.)
	customDismount = true

	[control.targetPos]
		#Range: 4.9E-324 ~ 1.7976931348623157E308
		targetPosX = 4.9E-324
		#Range: 4.9E-324 ~ 1.7976931348623157E308
		targetPosY = 4.9E-324
		#Range: 4.9E-324 ~ 1.7976931348623157E308
		targetPosZ = 4.9E-324

[sounds]
	#RWR Warning Sound Volume
	#Range: 0.0 ~ 1.0
	rwrWarningVol = 1.0
	#Missile Warning Sound Volume
	#Range: 0.0 ~ 1.0
	missileWarningVol = 1.0
	#IR Target Found Sound Volume
	#Range: 0.0 ~ 1.0
	irTargetToneVol = 0.5
	#Cockpit Voicelines Volume
	#Range: 0.0 ~ 1.0
	cockpitVoiceLineVol = 1.0
	#The voice line pack your fighter jets use. You can use resource packs to add custom sound packs. The packs that come built into the mod are 'eng_non_binary_goober', 'eng_generic_male'.
	passengerSoundPack = "eng_non_binary_goober"

[performance]
	#Range: 0 ~ 300
	maxRenderRackMissileNum = 30
	#Stats for nerds.
	debugMode = false
	#Sometimes when the server lags, the server side position of the player's seat entity doesn't get updated. Eventually the server thinks the seat is outside of the player's render distance and sends a discard packet. This causes the player to randomly fall out of their plane. This is solved by having the client tell the server explicitly where the seat actually is on the client side. This config controls how often (in ticks) this sync packet is sent from the client to the server. This used to be set to 40 for everyone, but some have exceptionally poor connections and may need this value to be lowered.
	#Range: 0 ~ 200
	syncSeatPosRate = 10

	[performance.entity-render-distance]
		#Range: 0.0 ~ 1000.0
		renderWeaponRackDistance = 256.0
		#Range: 0.0 ~ 1000.0
		renderTurretDistance = 256.0
		#Range: 0.0 ~ 1000.0
		renderEngineDistance = 256.0
		#Range: 0.0 ~ 1000.0
		renderRadarDistance = 256.0
		#Range: 0.0 ~ 1000.0
		renderOtherExternalPartDistance = 192.0

	[performance.helicopter-input]
		#Enable helicopter-specific input smoothing for pitch/roll/yaw.
		enableHeliInputSmoothing = true
		#Per-tick approach step for heli pitch input smoothing. Smaller = smoother (0-1).
		#Range: 0.0 ~ 1.0
		heliPitchSmoothingStep = 0.06
		#Per-tick approach step for heli roll input smoothing. Smaller = smoother (0-1).
		#Range: 0.0 ~ 1.0
		heliRollSmoothingStep = 0.06
		#Per-tick approach step for heli yaw input smoothing. Smaller = smoother (0-1).
		#Range: 0.0 ~ 1.0
		heliYawSmoothingStep = 0.04

	[performance.tank-tracks]
		#Enable dynamic ground textures on tank tracks.
		enableTrackGroundTextures = true
		#Enable debug visualization for track texture positions (colored markers and text).
		trackDebugMode = false
		#X offset for track texture sampling position.
		#Range: -10.0 ~ 10.0
		trackTextureOffsetX = 0.0
		#Y offset for track texture sampling position (height below vehicle).
		#Range: -10.0 ~ 10.0
		trackTextureOffsetY = -1.0
		#Z offset for track texture sampling position.
		#Range: -10.0 ~ 10.0
		trackTextureOffsetZ = 0.0

	[performance.hud]
		#Enable the modern, consolidated vehicle HUD.
		enableModernHUD = false
		#Opacity of the modern HUD panels (0.0-1.0).
		#Range: 0.0 ~ 1.0
		modernHudOpacity = 0.85
		#Scale of the modern HUD panels (0.5-1.5).
		#Range: 0.5 ~ 1.5
		modernHudScale = 1.0
		#Speed units: mps (m/s), kph (km/h), knots (kt)
		hudSpeedUnit = "mps"
		#Altitude units: m (meters), ft (feet)
		hudAltUnit = "m"
		#If true, keeps the stick/rudder control overlay visible when Modern HUD is enabled.
		showControlsInModernHUD = false

