modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="${issue_tracker}"
showAsResourcePack=false

[[mods]]
	modId="${mod_id}"
	version="${version}"
	displayName="${mod_name}"
	logoFile= "../${mod_id}.png"
    displayURL="https://www.curseforge.com/minecraft/mc-mods/diamond-star-combat"
    updateJSONURL="https://raw.githubusercontent.com/1whohears/ModVersions/main/DiamondStarCombat/update.json"
	displayTest = "MATCH_VERSION"
	authors="1whohears"
	credits="My Lizard"
	description='''${mod_description}'''

[[dependencies."${mod_id}"]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId = "onewholibs"
    mandatory = true
    versionRange = "[${onewholibs_version},)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "architectury"
    mandatory = true
    versionRange = "[${architectury_version},)"
    ordering = "NONE"
    side = "BOTH"



[[dependencies."${mod_id}"]]
    modId="minigames"
    mandatory=false
    versionRange="[${minigames_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="distant_players"
    mandatory=false
    versionRange="[${distant_players_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="jei"
    mandatory=false
    versionRange="[${jei_version},)"
    ordering="NONE"
    side="BOTH"